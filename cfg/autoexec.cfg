// CS:GO Legacy - Performance & Competitive Configuration
// Optimized for AMD Ryzen 5 4600G (Radeon Vega 7 APU) on Linux (Vulkan/RADV)

// Resolution & display mode (1280x960 4:3 fullscreen; 0 = fullscreen)
mat_setvideomode "1280" "960" "0"

// Frame rate & multithreaded rendering
fps_max "0"
fps_max_menu "120"
mat_queue_mode "2"
mat_powersavingsmode "0"

// Dynamic lighting & effects (reduces iGPU fragment shader and CPU overhead)
r_dynamic "0"
r_eyegloss "0"
r_eyemove "0"
r_eyeshift_x "0"
r_eyeshift_y "0"
r_eyeshift_z "0"
r_eyesize "0"
muzzleflash_light "0"
func_break_max_pieces "0"
cl_detail_avoid_force "0"
cl_detail_avoid_radius "0"
cl_detail_avoid_recover_speed "0"
cl_detail_max_sway "0"

// Memory & asset streaming (avoids stutter on shared system RAM/VRAM)
cl_forcepreload "0"
r_drawtracers_firstperson "0"

// Audio async mixing (prevents audio thread from blocking frame times)
snd_mix_async "1"
snd_mixahead "0.025"
snd_hwcompat "0"

// Network rates (128 tick ready)
rate "786432"
cl_cmdrate "128"
cl_updaterate "128"
cl_interp "0"
cl_interp_ratio "1"

// Input & UI overhead
joystick "0"
joystick_force_disabled "1"
joystick_force_disabled_set_from_options "1"
cl_freezecameffects_showholiday "0"
cl_showhelp "0"
cl_autohelp "0"
gameinstructor_enable "0"
cl_disablehtmlmotd "1"

host_writeconfig
echo ">>> CS:GO Legacy autoexec.cfg loaded <<<"
