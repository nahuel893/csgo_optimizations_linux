# Sway / Wayland window rules for CS:GO Legacy (csgo_linux64)
for_window [class="^csgo_linux64$"] opacity 1.0
for_window [app_id="^csgo_linux64$"] opacity 1.0

output HDMI-A-1 allow_tearing yes
for_window [class="^csgo_linux64$"] allow_tearing yes
for_window [app_id="^csgo_linux64$"] allow_tearing yes
